name: set background video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct link to an .mp4"
        required: true

permissions:
  contents: write

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and compress
        env:
          SRC: ${{ inputs.url }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          curl -fsSL -A "Mozilla/5.0" "$SRC" -o raw.mp4
          mkdir -p assets
          ffmpeg -y -loglevel error -i raw.mp4 -an \
            -vf "scale='min(1920,iw)':-2,fps=30" \
            -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -movflags +faststart assets/bg.mp4
          ffmpeg -y -loglevel error -i assets/bg.mp4 -vframes 1 -q:v 4 assets/bg.jpg
          rm raw.mp4
          ls -la assets
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then echo "no change"; exit 0; fi
          git config user.name "xanzplug"
          git config user.email "175267241+xanzplug@users.noreply.github.com"
          git add assets/bg.mp4 assets/bg.jpg
          git commit -m "Update background video"
          git push
