name: refresh avatar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/update-avatar.sh
      - run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "xanzplug"
          git config user.email "175267241+xanzplug@users.noreply.github.com"
          git commit -am "Update avatar"
          git push
